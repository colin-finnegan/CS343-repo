<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Grail Layout with Flexbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh; 
      font-family: Arial, sans-serif;
    }

    header, footer {
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .middler {
      display: flex;
      flex: 1; 
    }

    .sidebar {
      flex: 0 0 200px; 
      background-color: #f4f4f4;
      padding: 15px;
    }

    .sidebar.left {
      background-color: #ddd;
    }

    .sidebar.right {
      background-color: #ccc;
    }

    main {
      flex: 1; 
      padding: 15px;
      background-color: #f9f9f9;
      flex-basis: 0; 
    }

    footer {
      margin-top: auto; 
    }
  </style>
</head>
<body>
  <header>
    Header
  </header>

  <div class="middler">
    <aside class="sidebar left">
      Sidebar
    </aside>

    <main>
      Main Content
    </main>

    <aside class="sidebar right">
      Sidebar
    </aside>
  </div>

  <footer>
    Footer
  </footer>
</body>
</html>
