<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout with Header, Nav, Main, Sidebar, Advertising, and Footer</title>
  <style>
    /* Reset default margin and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Basic styling for all elements */
    body {
      font-family: Arial, sans-serif;
    }

    .wrapper {
      display: grid;
      gap: 20px; /* Space between grid items */
      padding: 20px; /* Padding around the grid */
      min-height: 100vh; /* Ensure the wrapper fills the viewport */
    }

    /* Shared styling for all blocks */
    .main-head, .main-nav, .content, .side, .ad, .main-footer {
      padding: 20px;
      background-color: #f4f4f4;
      border: 1px solid #ccc;
      text-align: center;
    }

    /* Header */
    .main-head {
      background-color: #333;
      color: white;
    }

    /* Navigation */
    .main-nav {
      background-color: #ddd;
    }

    .main-nav ul {
      list-style: none;
    }

    .main-nav ul li {
      margin-bottom: 10px;
    }

    .main-nav ul li a {
      text-decoration: none;
      color: #333;
    }

    /* Sidebar and Advertising */
    .side {
      background-color: #e0e0e0;
    }

    .ad {
      background-color: #ccc;
    }

    /* Footer */
    .main-footer {
      background-color: #333;
      color: white;
    }

    /* Grid layout */
    .wrapper {
      grid-template-areas:
        "header"
        "nav"
        "main"
        "sidebar"
        "ad"
        "footer";
    }

    @media (min-width: 500px) {
      .wrapper {
        grid-template-columns: 1fr 3fr;
    grid-template-areas:
      "header  header"
      "nav     nav"
      "sidebar content"
      "ad      footer";
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="main-head">Header</header>
    <nav class="main-nav">
      <ul>
        <li><a href="">Nav 1</a></li>
        <li><a href="">Nav 2</a></li>
        <li><a href="">Nav 3</a></li>
      </ul>
    </nav>
    <article class="content">
      <h1>Main Article Area</h1>
      <p>
        This is the main content area. It will scale and adapt to different screen sizes.
      </p>
    </article>
    <aside class="side">Sidebar</aside>
    <div class="ad">Advertising</div>
    <footer class="main-footer">Footer</footer>
  </div>
</body>
</html>
