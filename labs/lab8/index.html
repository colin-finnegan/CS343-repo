<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="author" content="Michael S. Kirkpatrick">
<title>Fetching JSON Data</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="#">World Bank Data Viewer</a>
  </div>
</nav>

<br>

<div class="row container-fluid">
  <div class="col">
    <form id="queryForm">
      <div class="form-group">
        <label for="countrySelect">Select a country</label>
        <input class="form-control" type="text" id="countrySelect" value="United States">
      </div>
      <div class="row mt-4">
        <div class="col-6 form-group">
          <label for="dateSelect">Start date</label>
          <input class="form-control" type="text" id="startDateSelect" value="1960">
        </div>
        <div class="col form-group">
          <label for="dateSelect">End date</label>
          <input class="form-control" type="text" id="endDateSelect" value="2023">
        </div>
      </div>
      <div class="row mt-4">
        <button type="submit" class="btn btn-primary" id="queryButton">Run query</button>
      </div>
      <div class="row mt-4">
        <small class="fst-italic" id="metadata"></small>
      </div>
    </form>
  </div>

  <div class="col">
    <div class="card">
      <div class="card-header">
        Total Population &ndash; <span id="tableHeader">USA</span>
      </div>
      <div class="card-body overflow-auto" style="max-height: 75vh">
        <ul class="list-group mt-2 mb-0">
          <li class="list-group-item bg-secondary text-white py-0 font-weight-bold">
            <div class="row">
              <div class="col-4 text-center border-right">Year</div>
              <div class="col text-center">Population Total</div>
            </div>
          </li>
        </ul>
        <ul class="list-group mt-0" id="listData"></ul>
      </div>
    </div>
  </div>
</div>

  <script src="data.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
          crossorigin="anonymous"></script>
