<h1 class="p-4 bg-success-subtle">Controlling Bootstrap with JavaScript</h1>

<!-- DO NOT MODIFY THIS DIV -->
<div class="modal fade" id="item-name-modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalLabel">Update Item</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label for="label-name" class="form-label">Update label text:</label>
        <input class="form-control" type="text" id="label-name">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="save-button">Save changes</button>
      </div>
    </div>
  </div>
</div>
<!-- END OF DO NOT MODIFY -->
