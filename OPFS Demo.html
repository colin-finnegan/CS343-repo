      <div class="row mb-3">
        <div class="col">

      </div>

        <div class="col position-relative">
          <button type="button" class="btn btn-secondary" name="save-btn">Save as bla.txt</button>
          <div class="toast-container d-inline-flex ms-2">
            <div id="save-toast" class="toast bg-success-subtle text-success-emphasis w-auto px-4" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="toast-body py-2">File saved</div>
            </div>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <button type="button" class="btn btn-secondary" name="open-btn">Open bla.txt</button>
      </div>
      <div class="row mb-3">
        <div class="col">
          <button type="button" class="btn btn-secondary" name="export-btn">Export data.json</button>
          <div class="toast-container d-inline-flex ms-2">
            <div id="export-toast" class="toast bg-success-subtle text-success-emphasis w-auto px-4" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="toast-body py-2">File exported</div>
            </div>
          </div>
          <div class="toast-container d-inline-flex ms-2">
            <div id="export-toast-failed" class="toast bg-danger-subtle text-success-emphasis w-auto px-4" role="alert" aria-live="assertive" aria-atomic="true">
              <div class="toast-body py-2">File export failed</div>
            </div>
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-auto">
          <button type="button" class="btn btn-secondary" name="upload-btn">Upload</button>
        </div>
        <div class="col-auto">
          <input type="file" class="form-control" name="data">
        </div>
      </div>
    </form>
  </div>

// A Toast is a short message that disappears after a few seconds.
function showToast(it) {
  let toast = document.getElementById(it);
  const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toast);
  toastBootstrap.show();
}

function fetchFile() {
  fetch('https://w3.cs.jmu.edu/kirkpams/343/demos/opfs/data.json')
    .then(resp => resp.text())
    .then(text => contents.value = text)
    .catch(err => console.error(err.name, err.message));
}

(function() {
  const form = document.getElementById('file-form');
